name: Deploy Sagrilaft to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Ejecutar script de despliegue en el VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 2.25.69.176
          username: root
          key: ${{ secrets.VPS }}
          envs: GH_TOKEN
          script: |
            cd /opt/sagrilaft
            git remote set-url origin https://Juangar15:${GH_TOKEN}@github.com/Juangar15/sagrilaft.git
            git fetch origin
            git reset --hard origin/main
            bash deploy.sh
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
